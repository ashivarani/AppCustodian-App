# ==============================================================================
# Project-Wide Gradle & Build Environment Configuration
# ==============================================================================
# Settings configured directly within Android Studio settings will override
# values specified in this file.
# See: https://docs.gradle.org/current/userguide/build_environment.html
# ==============================================================================

# JVM heap allocation and encoding parameters for the Gradle Daemon process.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Enables parallel execution across decoupled modules (improves multi-module build speeds).
# org.gradle.parallel=true

# Enforces the AndroidX package structure instead of legacy Support Libraries.
# See: https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# Configures default Kotlin code style formatting rules ("official" or "obsolete").
kotlin.code.style=official

# Generates non-transitive R classes to reduce APK size and build times.
# Limits resource references strictly to those defined in the local module.
android.nonTransitiveRClass=true