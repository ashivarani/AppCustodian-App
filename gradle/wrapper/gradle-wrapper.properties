# Gradle Wrapper Configuration
# Specifies the distribution version and verification rules used to execute project builds.

distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists

# The official Gradle distribution archive downloaded by the wrapper
distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.5-bin.zip

# Timeout setting (in milliseconds) for downloading the Gradle distribution
networkTimeout=10000

# Verifies that the distribution URL uses a secure HTTPS protocol
validateDistributionUrl=true

zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists